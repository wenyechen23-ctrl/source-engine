name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Download engine artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          branch: master
          name: source-engine-arm64
          path: eng
          if_no_artifact_found: fail
      - name: Download shell
        uses: actions/checkout@v4
        with:
          repository: nillerusr/srceng-android
          ref: android-fixes
          path: shell
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: shell
        run: |
          set -e
          SDK=${ANDROID_HOME}
          BT=$(ls -d $SDK/build-tools/* | sort -V | tail -1)
          AJ=$(ls $SDK/platforms/android-*/android.jar | sort -V | tail -1)
          wget -q https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
          unzip -q android-ndk-r10e-linux-x86_64.zip
          STRIP=$PWD/android-ndk-r10e/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin/aarch64-linux-android-strip
          ls -l $STRIP
          echo "BT=$BT"
          echo "STRIP=$STRIP"
          mkdir -p libs/arm64-v8a
          find ../eng/build -name '*.so' -print0 | xargs -0 -I{} cp -f {} libs/arm64-v8a/
          for p in ../eng/out/lib/android/aarch64/libSDL2.so lib/android/aarch64/libSDL2.so; do
            if [ -f "$p" ]; then cp -f "$p" libs/arm64-v8a/ && echo "SDL2 from $p" && break; fi
          done
          if [ -n "$STRIP" ]; then
            for f in libs/arm64-v8a/*.so; do "$STRIP" --strip-unneeded "$f" || true; done
          fi
          du -sh libs/arm64-v8a
          ls -la libs/arm64-v8a
          rm -rf build
          mkdir -p build/gen build/classes build/lib/arm64-v8a
          cp libs/arm64-v8a/*.so build/lib/arm64-v8a/
          $BT/aapt2 compile --dir res -o build/res.zip
          $BT/aapt2 link -o build/base.apk -I $AJ --manifest AndroidManifest.xml -R build/res.zip --java build/gen --auto-add-overlay -A assets
          javac -nowarn -source 8 -target 8 -encoding UTF-8 -classpath $AJ -d build/classes $(find src build/gen -name '*.java')
          cd build/classes
          jar cf ../classes.jar .
          cd ../..
          $BT/d8 --release --lib $AJ --output build build/classes.jar
          cp build/base.apk out.apk
          cd build
          zip -q -0 ../out.apk classes.dex
          zip -q -0 -r ../out.apk lib
          cd ..
          $BT/zipalign -f -p 4 out.apk aligned.apk
          keytool -genkeypair -keystore k.jks -alias k -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname CN=mod || true
          $BT/apksigner sign --ks k.jks --ks-pass pass:android --key-pass pass:android --out srceng-gmod.apk aligned.apk
          $BT/apksigner verify srceng-gmod.apk
          du -h srceng-gmod.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: srceng-gmod
          path: shell/srceng-gmod.apk
