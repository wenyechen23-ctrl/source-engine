name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Download engine artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          branch: master
          name: source-engine-arm64
          path: eng
          if_no_artifact_found: fail
      - name: Prepare libs
        run: |
          mkdir -p engp/build engp/lib/out/lib/android/aarch64
          cp -r eng/build/. engp/build/ 2>/dev/null || true
          cp eng/out/lib/android/aarch64/libSDL2.so engp/lib/out/lib/android/aarch64/ 2>/dev/null || true
          ls engp/build | head
      - name: Download shell
        uses: actions/checkout@v4
        with:
          repository: nillerusr/srceng-android
          ref: android-fixes
          path: shell
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: shell
        run: |
          chmod +x ../build_apk.sh
          ENG=../engp bash ../build_apk.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: srceng-gmod
          path: shell/srceng-gmod.apk
